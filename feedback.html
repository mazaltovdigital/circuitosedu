<section class="section-box" id="feedback-aluno">
    <h3>📊 Avaliação da Experiência (Pesquisa de Mestrado)</h3>
    <p>Sua participação é fundamental para a validação deste produto educacional.</p>
    <form id="form-pesquisa">
        <label>1. O Tutor IA ajudou a esclarecer suas dúvidas sobre Circuitos CA?</label><br>
        <input type="radio" name="pergunta1" value="sim"> Sim 
        <input type="radio" name="pergunta1" value="nao"> Não<br><br>

        <label>2. Como você avalia a facilidade de uso da Realidade Aumentada?</label><br>
        <select name="pergunta2">
            <option value="excelente">Excelente</option>
            <option value="bom">Bom</option>
            <option value="regular">Regular</option>
        </select><br><br>

        <label>3. Comentários adicionais:</label><br>
        <textarea name="comentarios" rows="4" style="width:100%; border-radius:5px; border:1px solid #ddd;"></textarea><br><br>

        <button type="submit" style="background:var(--blue); color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">Enviar Feedback</button>
    </form>
</section>
