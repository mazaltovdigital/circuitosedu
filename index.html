<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitosEdu - Plataforma CA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="main-header-fixed"></header>

<div class="main-layout">
    <nav class="sidebar">
        <h3 class="nav-title">Menu Principal</h3>
        <ul class="nav-list">
            <li><a href="#phet">🔬 Laboratório Virtual</a></li>
            <li><a href="#feedback-section">📊 Feedback dos Alunos</a></li>
        </ul>
        <a href="assets/roteiro_pratica.pdf" class="btn-download" download>📥 Baixar Roteiro (PDF)</a>
    </nav>

    <main class="main-content">
        <section class="section-box" id="phet">
            <h2>🔬 Simulação Interativa PHET</h2>
            <div class="iframe-container">
                <iframe src="https://phet.colorado.edu/sims/html/circuit-construction-kit-ac/latest/circuit-construction-kit-ac_all.html?locale=pt" allowfullscreen></iframe>
            </div>
        </section>

        <section class="section-box" id="feedback-section">
            <h2>📊 Feedback: Mediação da IA</h2>
            <div class="feedback-form">
                <p>O Tutor IA auxiliou efetivamente no seu aprendizado?</p>
                <div class="radio-group" style="display:flex; gap:20px; margin: 10px 0;">
                    <label><input type="radio" name="f" value="sim"> Sim</label>
                    <label><input type="radio" name="f" value="nao"> Não</label>
                </div>
                <textarea id="feedback-text" placeholder="Deixe seu comentário para a pesquisa..."></textarea>
                <button onclick="salvarFeedback()" class="btn-download" style="width:100%; border:none; cursor:pointer;">Enviar Feedback</button>
            </div>
        </section>
    </main>

    <aside class="chat-sidebar">
        <div class="chat-header">🤖 Tutor IA Mediador</div>
        <div id="chat-content">
            <div class="bubble tutor-msg">Olá! Sou seu assistente para circuitos CA. Como posso te orientar hoje?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Digite aqui..." onkeydown="if(event.key==='Enter') enviarChat()">
            <button onclick="enviarChat()" class="btn-chat">➤</button>
        </div>
    </aside>
</div>

<script>
    // --- LÓGICA DO TUTOR IA ---
    async function enviarChat() {
        const input = document.getElementById('msg-input');
        const box = document.getElementById('chat-content');
        if(!input.value.trim()) return;

        box.innerHTML += `<div class="bubble user-msg">${input.value}</div>`;
        const texto = input.value; 
        input.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: texto})
            });
            const data = await res.json();
            box.innerHTML += `<div class="bubble tutor-msg">${data.reply}</div>`;
        } catch(e) { 
            box.innerHTML += `<div class="bubble tutor-msg">Erro de conexão com a IA.</div>`; 
        }
        box.scrollTop = box.scrollHeight;
    }

    // --- LÓGICA DO FEEDBACK ---
    async function salvarFeedback() {
        const radio = document.querySelector('input[name="f"]:checked');
        const texto = document.getElementById('feedback-text').value;
        if(!radio) { alert("Selecione uma opção!"); return; }

        try {
            const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ajudou: radio.value, comentario: texto })
            });
            if(res.ok) { alert("Feedback enviado com sucesso!"); document.getElementById('feedback-text').value = ''; }
        } catch(e) { alert("Erro ao enviar feedback."); }
    }
</script>
</body>
</html>
