<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CircuitosEdu WebAR - Fasores e Componentes 3D</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .ar-ui-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 440px;
    }
    .top-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 440px;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar flex justify-between items-center bg-slate-900/90 text-white p-3 rounded-2xl shadow-xl backdrop-blur-md border border-slate-700">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <span class="text-xs font-bold tracking-wide">CircuitosEdu WebAR (4 TAGs Ativas)</span>
    </div>
    <a href="index.html" class="text-[11px] bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded-full font-bold transition">Voltar à Trilha</a>
  </div>

  <!-- Painel Dinâmico de Conceitos em Tempo Real -->
  <div class="ar-ui-overlay bg-slate-900/95 text-white p-4 rounded-2xl shadow-2xl border border-blue-500/40 backdrop-blur-md">
    <h3 id="ra-title" class="text-sm font-bold text-amber-400">📷 Aponte para uma das TAGs na Bancada</h3>
    <p id="ra-desc" class="text-xs text-slate-300 mt-1 leading-relaxed">
      Aponte para o TAG 1 (Resistor), TAG 2 (Indutor), TAG 3 (Capacitor) ou TAG 4 (Impedância Z).
    </p>
  </div>

  <!-- Cena AR habilitando Presets e Códigos Matriciais 3x3 -->
  <a-scene embedded 
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- ==================== TAG 1: RESISTOR (HIRO) ==================== -->
    <a-marker preset="hiro" id="marker-resistor" smooth="true" smoothCount="5">
      <a-cylinder position="0 0.3 0" rotation="0 0 90" radius="0.22" height="1.1" color="#fde047">
        <a-ring position="0 0.25 0" rotation="90 0 0" radius-inner="0.221" radius-outer="0.24" color="#ef4444"></a-ring>
        <a-ring position="0 0.05 0" rotation="90 0 0" radius-inner="0.221" radius-outer="0.24" color="#a855f7"></a-ring>
        <a-ring position="0 -0.15 0" rotation="90 0 0" radius-inner="0.221" radius-outer="0.24" color="#78350f"></a-ring>
      </a-cylinder>
      <a-entity position="0 1.0 0">
        <a-box position="0.5 0 0" width="1" height="0.04" depth="0.04" color="#ef4444"></a-box>
        <a-cone position="1.05 0 0" rotation="0 0 -90" radius-bottom="0.08" height="0.15" color="#ef4444"></a-cone>
        <a-text value="V(t) [0 deg]" position="0.2 0.2 0" scale="0.8 0.8 0.8" color="#ef4444"></a-text>
        <a-box position="0.4 -0.15 0" width="0.8" height="0.03" depth="0.03" color="#3b82f6"></a-box>
        <a-cone position="0.85 -0.15 0" rotation="0 0 -90" radius-bottom="0.07" height="0.12" color="#3b82f6"></a-cone>
        <a-text value="I(t) [0 deg]" position="0.2 -0.35 0" scale="0.8 0.8 0.8" color="#3b82f6"></a-text>
      </a-entity>
    </a-marker>

    <!-- ==================== TAG 2: INDUTOR (KANJI) ==================== -->
    <a-marker preset="kanji" id="marker-indutor" smooth="true" smoothCount="5">
      <a-torus position="0 0.3 0" rotation="90 0 0" radius="0.4" radius-tubular="0.08" color="#d97706"></a-torus>
      <a-cylinder position="0 0.3 0" radius="0.16" height="0.7" color="#64748b"></a-cylinder>
      <a-entity position="0 1.0 0">
        <a-box position="0 0.5 0" width="0.04" height="1" depth="0.04" color="#ef4444"></a-box>
        <a-cone position="0 1.05 0" radius-bottom="0.08" height="0.15" color="#ef4444"></a-cone>
        <a-text value="V(t) [+90 deg]" position="0.1 0.7 0" scale="0.8 0.8 0.8" color="#ef4444"></a-text>
        <a-box position="0.4 0 0" width="0.8" height="0.03" depth="0.03" color="#3b82f6"></a-box>
        <a-cone position="0.85 0 0" rotation="0 0 -90" radius-bottom="0.07" height="0.12" color="#3b82f6"></a-cone>
        <a-text value="I(t) [0 deg]" position="0.3 -0.2 0" scale="0.8 0.8 0.8" color="#3b82f6"></a-text>
      </a-entity>
    </a-marker>

    <!-- ==================== TAG 3: CAPACITOR (BARCODE ID: 5) ==================== -->
    <a-marker type="barcode" value="5" id="marker-capacitor" smooth="true" smoothCount="5">
      <a-cylinder position="-0.15 0.3 0" radius="0.35" height="0.04" color="#0284c7" rotation="0 90 0"></a-cylinder>
      <a-cylinder position="0.15 0.3 0" radius="0.35" height="0.04" color="#0284c7" rotation="0 90 0"></a-cylinder>
      <a-cylinder position="0 0.3 0" radius="0.02" height="0.8" color="#94a3b8" rotation="0 0 90"></a-cylinder>
      <a-entity position="0 1.0 0">
        <!-- V em 0° horizontal -->
        <a-box position="0.4 0 0" width="0.8" height="0.03" depth="0.03" color="#ef4444"></a-box>
        <a-cone position="0.85 0 0" rotation="0 0 -90" radius-bottom="0.07" height="0.12" color="#ef4444"></a-cone>
        <a-text value="V(t) [0 deg]" position="0.3 -0.2 0" scale="0.8 0.8 0.8" color="#ef4444"></a-text>
        <!-- I adiantada +90° para cima (ou V atrasada -90°) -->
        <a-box position="0 0.5 0" width="0.04" height="1" depth="0.04" color="#3b82f6"></a-box>
        <a-cone position="0 1.05 0" radius-bottom="0.08" height="0.15" color="#3b82f6"></a-cone>
        <a-text value="I(t) [+90 deg]" position="0.1 0.7 0" scale="0.8 0.8 0.8" color="#3b82f6"></a-text>
      </a-entity>
    </a-marker>

    <!-- ==================== TAG 4: TRIÂNGULO DE IMPEDÂNCIA Z (BARCODE ID: 6) ==================== -->
    <a-marker type="barcode" value="6" id="marker-impedancia" smooth="true" smoothCount="5">
      <!-- Base R (Horizontal) -->
      <a-box position="0.5 0.1 0" width="1" height="0.04" depth="0.04" color="#f59e0b"></a-box>
      <a-text value="R" position="0.4 0.25 0" color="#f59e0b" scale="0.9 0.9 0.9"></a-text>
      <!-- Altura (XL - XC) Vertical -->
      <a-box position="1.0 0.5 0" width="0.04" height="0.8" depth="0.04" color="#8b5cf6"></a-box>
      <a-text value="X = (XL - XC)" position="1.05 0.5 0" color="#8b5cf6" scale="0.7 0.7 0.7"></a-text>
      <!-- Hipotenusa Z (Inclinada) -->
      <a-box position="0.5 0.5 0" rotation="0 0 38.6" width="1.28" height="0.05" depth="0.05" color="#10b981"></a-box>
      <a-text value="Z = sqrt(R^2 + X^2)" position="0.1 0.7 0" color="#10b981" scale="0.8 0.8 0.8"></a-text>
    </a-marker>

    <a-entity camera="near: 0.01; far: 1000;"></a-entity>
  </a-scene>

  <script>
    const title = document.getElementById('ra-title');
    const desc = document.getElementById('ra-desc');

    const mResistor = document.getElementById('marker-resistor');
    const mIndutor = document.getElementById('marker-indutor');
    const mCapacitor = document.getElementById('marker-capacitor');
    const mImpedancia = document.getElementById('marker-impedancia');

    if (mResistor) {
      mResistor.addEventListener('markerFound', () => {
        title.innerText = "⚡ TAG 1: Resistor Puro (R)";
        desc.innerHTML = "<strong>Comportamento:</strong> Efeito Joule. Tensão e Corrente em <strong>fase (0°)</strong>. Não depende da frequência.";
      });
    }

    if (mIndutor) {
      mIndutor.addEventListener('markerFound', () => {
        title.innerText = "🌀 TAG 2: Indutor Ideal (L / XL)";
        desc.innerHTML = "<strong>Comportamento:</strong> Campo Magnético. Reatância <em>X<sub>L</sub> = 2·π·f·L</em>. Tensão <strong>adiantada em +90°</strong>.";
      });
    }

    if (mCapacitor) {
      mCapacitor.addEventListener('markerFound', () => {
        title.innerText = "🔋 TAG 3: Capacitor (C / XC)";
        desc.innerHTML = "<strong>Comportamento:</strong> Campo Elétrico. Reatância <em>X<sub>C</sub> = 1/(2·π·f·C)</em>. Corrente <strong>adiantada em +90°</strong> (Tensão atrasada em -90°).";
      });
    }

    if (mImpedancia) {
      mImpedancia.addEventListener('markerFound', () => {
        title.innerText = "📐 TAG 4: Triângulo de Impedância (Z)";
        desc.innerHTML = "<strong>Equação Fasorial:</strong> <em>Z = √( R² + (X<sub>L</sub> - X<sub>C</sub>)² )</em>. Relação trigonométrica entre Resistência e Reatâncias.";
      });
    }
  </script>
</body>
</html>
