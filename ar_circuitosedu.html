<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CircuitosEdu RA - Leitor de Marcadores 3D</title>
  
  <!-- Bibliotecas WebAR Open-Source compatíveis com iOS e Android -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .ar-ui-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 400px;
    }
    .top-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- Barra Superior de Orientação -->
  <div class="top-bar flex justify-between items-center bg-slate-900/90 text-white p-3 rounded-2xl shadow-xl backdrop-blur-md border border-slate-700">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <span class="text-xs font-bold tracking-wide">CircuitosEdu WebAR</span>
    </div>
    <a href="index.html" class="text-[11px] bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded-full font-bold">Voltar à Trilha</a>
  </div>

  <!-- Painel Inferior Dinâmico (Muda conforme o TAG detectado) -->
  <div class="ar-ui-overlay bg-slate-900/95 text-white p-4 rounded-2xl shadow-2xl border border-blue-500/40 backdrop-blur-md">
    <h3 id="ra-title" class="text-sm font-bold text-amber-400">📷 Aponte a câmera para um TAG impresso</h3>
    <p id="ra-desc" class="text-xs text-slate-300 mt-1 leading-relaxed">
      Aponte para os marcadores do Resistor (HIRO), Indutor (KANJI) ou Capacitor (LETRA C) para projetar os componentes e diagramas fasoriais 3D.
    </p>
  </div>

  <!-- Cena 3D / WebAR com Câmera -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- ==================== TAG 1: RESISTOR (Marcador Padrão HIRO) ==================== -->
    <a-marker preset="hiro" id="marker-resistor">
      <!-- Resistor 3D Cilindro com anéis -->
      <a-cylinder position="0 0.5 0" rotation="0 0 90" radius="0.25" height="1.2" color="#fde047">
        <a-ring position="0 0.2 0" rotation="90 0 0" radius-inner="0.25" radius-outer="0.26" color="#ef4444"></a-ring>
        <a-ring position="0 0 0" rotation="90 0 0" radius-inner="0.25" radius-outer="0.26" color="#a855f7"></a-ring>
        <a-ring position="0 -0.2 0" rotation="90 0 0" radius-inner="0.25" radius-outer="0.26" color="#78350f"></a-ring>
      </a-cylinder>
      <!-- Fasor V e I em Fase (0°) -->
      <a-entity position="0 1.2 0">
        <a-arrow direction="1 0 0" length="1" color="#ef4444"></a-arrow>
        <a-text value="V(t) [0°]" position="0.5 0.3 0" scale="0.8 0.8 0.8" color="#ef4444"></a-text>
        <a-arrow direction="1 0 0" length="0.8" color="#3b82f6"></a-arrow>
        <a-text value="I(t) [0°]" position="0.4 -0.2 0" scale="0.8 0.8 0.8" color="#3b82f6"></a-text>
      </a-entity>
    </a-marker>

    <!-- ==================== TAG 2: INDUTOR (Marcador KANJI) ==================== -->
    <a-marker preset="kanji" id="marker-indutor">
      <!-- Bobina / Toroide 3D -->
      <a-torus position="0 0.5 0" rotation="90 0 0" radius="0.5" radius-tubular="0.08" color="#d97706" segments-tubular="24"></a-torus>
      <a-cylinder position="0 0.5 0" radius="0.2" height="0.9" color="#64748b"></a-cylinder>
      <!-- Fasores (V adiantado 90° de I) -->
      <a-entity position="0 1.3 0">
        <a-arrow direction="0 1 0" length="1" color="#ef4444"></a-arrow>
        <a-text value="V(t) [+90°]" position="0.1 0.8 0" scale="0.8 0.8 0.8" color="#ef4444"></a-text>
        <a-arrow direction="1 0 0" length="0.8" color="#3b82f6"></a-arrow>
        <a-text value="I(t) [0°]" position="0.5 -0.2 0" scale="0.8 0.8 0.8" color="#3b82f6"></a-text>
      </a-entity>
    </a-marker>

    <!-- Câmera do Dispositivo -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Lógica de Detecção e Atualização da Interface -->
  <script>
    const title = document.getElementById('ra-title');
    const desc = document.getElementById('ra-desc');

    const mResistor = document.getElementById('marker-resistor');
    const mIndutor = document.getElementById('marker-indutor');

    mResistor.addEventListener('markerFound', () => {
      title.innerText = "⚡ Componente R: Resistor Puro";
      desc.innerHTML = "<strong>Comportamento:</strong> Dissipação Joule pura. Tensão <em>V(t)</em> e Corrente <em>I(t)</em> permanecem em <strong>perfeita fase (defasagem 0°)</strong>.";
    });

    mIndutor.addEventListener('markerFound', () => {
      title.innerText = "🌀 Componente L: Indutor Ideal";
      desc.innerHTML = "<strong>Comportamento:</strong> Armazena energia em campo magnético. Reatância <em>X<sub>L</sub> = 2·π·f·L</em>. Tensão <strong>adiantada 90°</strong> em relação à corrente.";
    });
  </script>
</body>
</html>
