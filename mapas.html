<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapas Mentais - CircuitosEdu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="subpage-body">
    <header class="main-header-black" style="height: 80px;"></header>
    <main class="content-container">
        <button onclick="history.back()" class="btn-chat" style="width: auto; padding: 10px 20px; margin-bottom: 20px; border:none; border-radius:5px; cursor:pointer;">← Voltar</button>
        
        <h2>🧠 Mapas Mentais Técnicos</h2>
        <p>Clique nas imagens para ampliar os conceitos de Corrente Alternada.</p>

        <div class="circuit-grid" style="margin-top: 20px;">
            <div class="circuit-item">
                <img src="./assets/mapa-grandezas.png" alt="Mapa de Grandezas" class="circuit-img" style="height: 250px;">
                <h4>Grandezas e Senoides</h4>
                <p>Fórmulas de RMS, Pico, Frequência e Fase.</p>
            </div>
            <div class="circuit-item">
                <img src="./assets/mapa-ligacoes.png" alt="Mapa de Ligações" class="circuit-img" style="height: 250px;">
                <h4>Série vs Paralelo em CA</h4>
                <p>Análise de Impedância Equivalente e Fasores.</p>
            </div>
        </div>
    </main>
</body>
</html>
