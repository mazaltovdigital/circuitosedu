<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapas Mentais - CircuitosEdu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="subpage-body">
    <header class="main-header-black" style="height: 80px;"></header>
    <main class="content-container">
        <button onclick="history.back()" class="btn-chat" style="width: auto; padding: 10px 20px; margin-bottom: 20px;">← Voltar</button>
        <h2>🧠 Mapas Mentais: Grandezas e Ligações</h2>
        <div class="circuit-grid" style="margin-top: 20px;">
            <div class="circuit-item">
                <img src="assets/mapa-grandezas.png" alt="Mapa de Grandezas" class="circuit-img" onerror="this.src='https://via.placeholder.com/300x200?text=Mapa+Grandezas'">
                <p>Grandezas CA</p>
            </div>
            <div class="circuit-item">
                <img src="assets/mapa-ligacoes.png" alt="Mapa de Ligações" class="circuit-img" onerror="this.src='https://via.placeholder.com/300x200?text=Mapa+Ligacoes'">
                <p>Série vs Paralelo</p>
            </div>
        </div>
    </main>
</body>
</html>
