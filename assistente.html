<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tutor de Circuitos CA</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; background: #f4f4f4; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .user { background: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .tutor { background: #ddd; align-self: flex-start; }
        .input-box { display: flex; padding: 10px; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 10px; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-box">
        <input type="text" id="msg" placeholder="Sua dúvida...">
        <button onclick="send()">Enviar</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const text = input.value;
            if(!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';

            try {
                // SUBSTITUA PELO SEU LINK DA ABA DOMAINS NA VERCEL
                const res = await fetch('https://circuitosedu.vercel.app/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg tutor">${data.reply.replace(/\n/g, '<br>')}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="msg tutor">Erro de conexão.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
